#
# ci-unit-tests.yml
# Build and execute unit tests to catch functional issues in code
#

name: CI - Unit Tests

on:
  pull_request:
    branches:
    - bugfix-2.1.x
    # Cannot be enabled on 2.1.x until it contains the unit test framework
    #- 2.1.x
    paths-ignore:
    - config/**
    - data/**
    - docs/**
    - '**/*.md'
  push:
    branches:
    - bugfix-2.1.x
    # Cannot be enabled on 2.1.x until it contains the unit test framework
    #- 2.1.x
    paths-ignore:
    - config/**
    - data/**
    - docs/**
    - '**/*.md'

jobs:
  # This runs all unit tests as a single job. While it should be possible to break this up into
  # multiple jobs, they currently run quickly and finish long before the compilation tests.
  run_unit_tests:
    name: Unit Test
    # Disabled for this fork.
    #
    # Marlin's unit tests run `restore_configs`, which checks out the committed
    # Marlin/Configuration.h and then layers the test/*.ini deltas on top. The
    # harness therefore assumes that committed file is Marlin's stock default
    # configuration. Here it is the hot press machine config, and two of its
    # features have no implementation on the native target the tests build for:
    #
    #   - LCM1602 character LCD -> HD44780 drivers need Arduino libraries
    #     (fatal error: WProgram.h: No such file or directory)
    #   - MAX31855 thermocouples -> need SPI, absent from the LINUX HAL
    #     (undefined reference to `spiBegin()' in module/temperature.cpp)
    #
    # Making this job pass would mean overriding both away in the test configs,
    # at which point it exercises a machine unrelated to this one. Re-enable if
    # Marlin/Configuration.h ever builds for the native target.
    if: false

    runs-on: ubuntu-22.04

    steps:
    - name: Check out the PR
      uses: actions/checkout@v7

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-unit-v1
        restore-keys: |
          ${{ runner.os }}-pip-unit-

    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: |
          ~/.platformio
          .pio/build
          .pio/libdeps
        key: ${{ runner.os }}-pio-tests-v1
        restore-keys: |
          ${{ runner.os }}-pio-tests-

    - name: Select Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
        architecture: 'x64'

    - name: Install PlatformIO
      run: |
        pip install -U platformio
        pio upgrade --dev
        pio pkg update --global

    - name: Run All Unit Tests
      run: |
        make unit-test-all-local
